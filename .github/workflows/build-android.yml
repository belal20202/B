name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

env:
  GODOT_VERSION: "4.3"

jobs:
  build:
    name: build
    runs-on: ubuntu-22.04
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install export templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates
          mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable

      - name: Create debug keystore
        run: |
          rm -f /root/debug.keystore
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android \
            -keystore /root/debug.keystore -storepass android \
            -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deststoretype pkcs12
          ls -la /root/debug.keystore

      - name: Point Godot at Android SDK and JDK
        run: |
          godot --headless --quiet --editor --quit || true
          SETTINGS=$(ls ~/.config/godot/editor_settings-4*.tres | head -n 1)
          SDK=${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/lib/android-sdk}}
          JDK=${JAVA_HOME:-$(dirname $(dirname $(readlink -f $(which javac))))}
          echo "Settings: $SETTINGS  SDK: $SDK  JDK: $JDK"
          sed -i '/export\/android\/android_sdk_path/d;/export\/android\/java_sdk_path/d' "$SETTINGS"
          echo "export/android/android_sdk_path = \"$SDK\"" >> "$SETTINGS"
          echo "export/android/java_sdk_path = \"$JDK\"" >> "$SETTINGS"

      - name: Import project
        run: godot --headless --quiet --import || true

      - name: Export APK
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: /root/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          mkdir -p build
          godot --headless --verbose --export-debug "Android" build/Bassam.apk
          ls -la build

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Android-APK
          path: build/Bassam.apk
