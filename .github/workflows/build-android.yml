name: Build Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java Development Kit (JDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Create debug keystore
        run: |
          rm -f ~/.android/debug.keystore
          mkdir -p ~/.android
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore ~/.android/debug.keystore -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 9999

      - name: Point Godot at Android SDK and JDK
        run: |
          mkdir -p ~/.config/godot
          echo "export_credentials/android/sdk_path = \"$ANDROID_HOME\"" > ~/.config/godot/editor_settings-4.godot
          echo "export_credentials/android/debug_keystore = \"$HOME/.android/debug.keystore\"" >> ~/.config/godot/editor_settings-4.godot
          echo "export_credentials/android/debug_keystore_user = \"androiddebugkey\"" >> ~/.config/godot/editor_settings-4.godot
          echo "export_credentials/android/debug_keystore_pass = \"android\"" >> ~/.config/godot/editor_settings-4.godot

      - name: Download Godot Engine
        run: |
          wget https://github.com/godotengine/godot/releases/download/4.2.1-stable/Godot_v4.2.1-stable_linux.x86_64.zip
          unzip Godot_v4.2.1-stable_linux.x86_64.zip
          mv Godot_v4.2.1-stable_linux.x86_64 godot
          chmod +x godot

      - name: Download Godot Export Templates
        run: |
          wget https://github.com/godotengine/godot/releases/download/4.2.1-stable/Godot_v4.2.1-stable_export_templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/4.2.1.stable
          unzip Godot_v4.2.1-stable_export_templates.tpz -d ~/.local/share/godot/export_templates/4.2.1.stable/
          mv ~/.local/share/godot/export_templates/4.2.1.stable/templates/* ~/.local/share/godot/export_templates/4.2.1.stable/

      - name: Build Android APK
        run: |
          mkdir -p build/
          ./godot --headless --export-debug "Android" build/game.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: game-apk
          path: build/game.apk
